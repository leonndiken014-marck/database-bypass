<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_OS_V10 - CORE TERMINAL</title>
    <style>
        :root { --neon: #00ff41; --bg: #030303; --window: #0a0a0a; --red: #ff3e3e; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; font-size: 14px; }
        
        /* Background & Animasi */
        canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.1; }
        .hidden { display: none !important; }

        /* Login & Register Card */
        #auth-screen { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .auth-card { background: var(--window); padding: 30px; border: 1px solid var(--neon); width: 300px; text-align: center; box-shadow: 0 0 20px rgba(0,255,0,0.1); }
        input { background: transparent; border: 1px solid var(--neon); color: var(--neon); width: 100%; padding: 10px; margin: 5px 0; outline: none; box-sizing: border-box; }
        button { background: var(--neon); color: black; border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; }

        /* Dashboard Utama */
        #main-os { padding: 20px; height: 100vh; box-sizing: border-box; display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .panel { background: rgba(10,10,10,0.9); border: 1px solid var(--neon); padding: 15px; position: relative; overflow-y: auto; }
        .header { border-bottom: 1px solid var(--neon); padding-bottom: 10px; margin-bottom: 15px; font-weight: bold; font-size: 12px; display: flex; justify-content: space-between; }

        /* File Explorer */
        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 15px; }
        .file-icon { text-align: center; cursor: pointer; padding: 5px; border-radius: 5px; }
        .file-icon:hover { background: rgba(0,255,0,0.1); }
        .file-icon span { display: block; font-size: 10px; margin-top: 5px; }
        .locked { filter: grayscale(1); color: var(--red); }

        /* AI Assistant */
        #ai-panel { border-color: #38bdf8; color: #38bdf8; }
        .ai-msg { margin-bottom: 10px; line-height: 1.4; border-left: 2px solid #38bdf8; padding-left: 10px; }
        .ai-typing { font-style: italic; opacity: 0.7; }

        /* Decryption Overlay */
        #decrypt-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 100; display: none; justify-content: center; align-items: center; flex-direction: column; }
        .progress-bar { width: 300px; height: 10px; border: 1px solid var(--neon); margin-top: 20px; }
        .progress-fill { height: 100%; background: var(--neon); width: 0%; }
        
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body oncontextmenu="return false">

<canvas id="matrix"></canvas>

<!-- 1. SCREEN LOGIN/DAFTAR -->
<div id="auth-screen">
    <div class="auth-card" id="login-form">
        <h2 style="font-size: 16px;">[ CYBER_OS ACCESS ]</h2>
        <input type="text" id="regUser" placeholder="Username Baru">
        <input type="password" id="regPass" placeholder="Password Baru">
        <button onclick="register()">DAFTAR SISTEM</button>
        <p style="font-size: 10px; margin-top: 15px; cursor: pointer;" onclick="toggleAuth()">Sudah punya akses? Login</p>
    </div>
    
    <div class="auth-card hidden" id="real-login">
        <h2>[ VERIFY_IDENTITY ]</h2>
        <input type="text" id="logUser" placeholder="Username">
        <input type="password" id="logPass" placeholder="Password">
        <button onclick="login()">AUTHORIZE</button>
    </div>
</div>

<!-- 2. SCREEN DASHBOARD UTAMA -->
<div id="main-os" class="hidden">
    <div class="panel">
        <div class="header">
            <span>SYSTEM_EXPLORER_V10</span>
            <span id="user-display">USER: NULL</span>
        </div>
        
        <div class="file-grid">
            <div class="file-icon" onclick="openLocked('BANK_VAULT_ENCRYPTED.dat')">
                <div style="font-size: 30px;">📁</div>
                <span>Bank_Vault.dat</span>
                <span class="locked">[LOCKED]</span>
            </div>
            <div class="file-icon" onclick="openLocked('GOVERNMENT_LEAKS.zip')">
                <div style="font-size: 30px;">📂</div>
                <span>Gov_Leaks.zip</span>
                <span class="locked">[LOCKED]</span>
            </div>
            <div class="file-icon" onclick="openLocked('SATELLITE_CONTROL.exe')">
                <div style="font-size: 30px;">⚙️</div>
                <span>Sat_Control.exe</span>
                <span class="locked">[LOCKED]</span>
            </div>
            <div class="file-icon" onclick="alert('Ini foto Leon ganteng!')">
                <div style="font-size: 30px;">🖼️</div>
                <span>Leon_Photo.jpg</span>
            </div>
        </div>
    </div>

    <!-- 3. AI ASSISTANT PANEL -->
    <div class="panel" id="ai-panel">
        <div class="header" style="border-color: #38bdf8;">
            <span>LEON-AI v4.0</span>
            <span class="blink" style="color: #4ade80;">ONLINE</span>
        </div>
        <div id="ai-content">
            <div class="ai-msg"><b>[SYSTEM]</b>: Memulai protokol asisten cerdas...</div>
        </div>
        <div class="ai-typing" id="ai-status"></div>
    </div>
</div>

<!-- OVERLAY DEKRIPSI -->
<div id="decrypt-overlay">
    <h3 id="decrypt-title">BRUTE_FORCING_FILE...</h3>
    <div class="progress-bar"><div class="progress-fill" id="p-fill"></div></div>
    <p id="p-text" style="margin-top: 10px;">0%</p>
</div>

<script>
    // --- DATABASE SEDERHANA ---
    function register() {
        const u = document.getElementById('regUser').value;
        const p = document.getElementById('regPass').value;
        if(!u || !p) return alert("Isi data!");
        localStorage.setItem('cyber_u', u);
        localStorage.setItem('cyber_p', p);
        alert("Pendaftaran Berhasil! Silahkan Login.");
        toggleAuth();
    }

    function login() {
        const u = document.getElementById('logUser').value;
        const p = document.getElementById('logPass').value;
        if(u === localStorage.getItem('cyber_u') && p === localStorage.getItem('cyber_p')) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-os').classList.remove('hidden');
            document.getElementById('user-display').innerText = "USER: " + u.toUpperCase();
            talkAI("Akses diterima. Selamat datang, " + u + ". Saya LEON-AI, asisten pribadimu. Semua sistem dalam pengawasan saya.");
        } else {
            alert("AKSES DITOLAK: Identitas tidak dikenal!");
        }
    }

    function toggleAuth() {
        document.getElementById('login-form').classList.toggle('hidden');
        document.getElementById('real-login').classList.toggle('hidden');
    }

    // --- AI LOGIC (Cerdas & Teliti) ---
    function talkAI(text) {
        const box = document.getElementById('ai-content');
        const status = document.getElementById('ai-status');
        status.innerText = "LEON-AI sedang menganalisis...";
        
        setTimeout(() => {
            status.innerText = "";
            const msg = document.createElement('div');
            msg.className = "ai-msg";
            msg.innerHTML = `<b>[LEON-AI]</b>: ${text}`;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }, 1500);
    }

    // --- FILE LOCK LOGIC ---
    function openLocked(fileName) {
        talkAI("Mencoba mengakses file: " + fileName + ". Melakukan pemindaian tingkat enkripsi...");
        
        setTimeout(() => {
            const overlay = document.getElementById('decrypt-overlay');
            const fill = document.getElementById('p-fill');
            const txt = document.getElementById('p-text');
            
            overlay.style.display = 'flex';
            document.getElementById('decrypt-title').innerText = "DECRYPTING: " + fileName;
            
            let prog = 0;
            const timer = setInterval(() => {
                prog += Math.floor(Math.random() * 5) + 1;
                if(prog > 100) prog = 100;
                fill.style.width = prog + "%";
                txt.innerText = prog + "%";
                
                if(prog === 100) {
                    clearInterval(timer);
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        alert("ERROR 0x889: Enkripsi terlalu kuat! Dibutuhkan kunci fisik untuk membuka data ini.");
                        talkAI("Gagal mendekripsi " + fileName + ". Lapisan pertahanan file ini sangat teliti. Saya sarankan kita mencari celah lain.");
                    }, 1000);
                }
            }, 100);
        }, 2000);
    }

    // Matrix Effect
    const c = document.getElementById('matrix');
    const ctx = c.getContext('2d');
    c.width = window.innerWidth; c.height = window.innerHeight;
    const l = "010101010101010101"; const d = [];
    for(let x=0; x<c.width/16; x++) d[x]=1;
    function draw() {
        ctx.fillStyle="rgba(0,0,0,0.05)"; ctx.fillRect(0,0,c.width,c.height);
        ctx.fillStyle="#0F0"; ctx.font="15px arial";
        d.forEach((y,i)=>{
            ctx.fillText(l[Math.floor(Math.random()*l.length)], i*16, y*16);
            if(y*16>c.height && Math.random()>0.975) d[i]=0; d[i]++;
        });
    }
    setInterval(draw, 33);
</script>

</body>
</html>
