<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL OVERRIDE v8.0</title>
    <style>
        :root { --neon: #00ff41; --bg: #050505; --red: #ff3e3e; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; }
        #matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.1; }
        
        /* Layar Utama */
        #login-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; flex-direction: column; }
        .terminal-card { background: rgba(10, 10, 10, 0.9); padding: 30px; border: 1px solid var(--neon); border-radius: 5px; box-shadow: 0 0 20px rgba(0,255,65,0.2); width: 85%; max-width: 400px; }
        
        input { background: transparent; border: 1px solid var(--neon); color: var(--neon); width: 100%; padding: 12px; margin: 10px 0; outline: none; box-sizing: border-box; }
        button { background: var(--neon); color: black; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; }
        
        /* Layar Dalam (Rahasia) */
        #secret-dashboard { display: none; padding: 20px; height: 100vh; box-sizing: border-box; overflow-y: auto; background: rgba(0,0,0,0.9); border: 5px solid var(--neon); margin: 10px; position: relative; }
        .data-row { border-bottom: 1px solid #111; padding: 5px 0; font-size: 12px; display: flex; justify-content: space-between; }
        .header-dash { border-bottom: 2px solid var(--neon); padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        
        .blink { animation: blinker 1s linear infinite; color: var(--red); font-weight: bold; }
        @keyframes blinker { 50% { opacity: 0; } }

        #log-box { height: 100px; background: #000; border: 1px solid #222; padding: 10px; font-size: 10px; margin-top: 10px; overflow: hidden; }
    </style>
</head>
<body oncontextmenu="return false">

<canvas id="matrix-bg"></canvas>

<!-- LAYAR 1: INPUT TARGET -->
<div id="login-screen">
    <div class="terminal-card">
        <h3 style="text-align: center; letter-spacing: 3px;">DATABASE_BYPASS_V8</h3>
        <p style="font-size: 11px; text-align: center; color: #666;">ENCRYPTION: AES-256-GCM</p>
        <input type="text" id="targetID" placeholder="[INPUT_USER_ID_TARGET]">
        <button onclick="startHack()">INJECT DATA</button>
        <div id="log-box"></div>
    </div>
</div>

<!-- LAYAR 2: DASHBOARD RAHASIA (SETELAH BERHASIL) -->
<div id="secret-dashboard">
    <div class="header-dash">
        <span>CORE_ACCESS: GRANTED</span>
        <span class="blink">!! CLASSIFIED !!</span>
    </div>

    <div id="target-info">
        <p>IDENTIFIED_TARGET: <span id="display-id" style="color: white;"></span></p>
        <p>STATUS: <span style="color: #4ade80;">VULNERABLE</span></p>
    </div>

    <div style="margin-top: 30px;">
        <p style="background: var(--neon); color: black; padding: 5px; font-weight: bold;">[ EXTRACTED_DATA_PACKETS ]</p>
        <div id="fake-data">
            <!-- Data palsu akan muncul di sini -->
        </div>
    </div>

    <button onclick="location.reload()" style="background: var(--red); color: white; margin-top: 30px; width: auto; padding: 5px 15px;">DISCONNECT</button>
</div>

<script>
    // Matrix Background
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const letters = "0123456789ABCDEF"; const drops = [];
    for(let x = 0; x < canvas.width/16; x++) drops[x] = 1;
    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0F0"; ctx.font = "16px arial";
        drops.forEach((y, i) => {
            ctx.fillText(letters[Math.floor(Math.random() * letters.length)], i * 16, y * 16);
            if(y * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 33);

    function startHack() {
        const id = document.getElementById('targetID').value;
        if(!id) return alert("TARGET_NULL");

        const log = document.getElementById('log-box');
        let steps = ["> Initializing...", "> Bypassing Auth...", "> Dumping DB...", "> Success."];
        let i = 0;
        
        let timer = setInterval(() => {
            if(i < steps.length) {
                log.innerHTML += `<div>${steps[i]}</div>`; i++;
            } else {
                clearInterval(timer);
                showDashboard(id);
            }
        }, 1000);
    }

    function showDashboard(id) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('secret-dashboard').style.display = 'block';
        document.getElementById('display-id').innerText = id;

        // Generate data palsu biar serem
        const fakeData = document.getElementById('fake-data');
        for(let j=0; j<10; j++) {
            setTimeout(() => {
                const row = document.createElement('div');
                row.className = 'data-row';
                row.innerHTML = `<span>PKT_${Math.random().toString(36).substring(7).toUpperCase()}</span> <span>${(Math.random()*100).toFixed(4)}kb</span>`;
                fakeData.appendChild(row);
            }, j * 300);
        }
    }
</script>

</body>
</html>
